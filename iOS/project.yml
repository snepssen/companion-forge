# The iPhone and iPad app. `xcodegen` turns this into Companion.xcodeproj
# (not kept in git); build-ios.sh does that, stages the bundled data, builds
# and installs. A phone stays upright; an iPad turns every way.
name: Companion
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  CompanionPackage:
    path: ..
schemes:
  CompanionPhone:
    build:
      targets:
        Companion: all
targets:
  Companion:
    type: application
    platform: iOS
    sources:
      - path: App  # Assets.xcassets holds the icon, from ccrun --icon
      - path: Resources/snepssen-polyglot.onnx
        buildPhase: resources
      - path: Resources/snepssen-polyglot.onnx.json
        buildPhase: resources
      - path: Resources/silero_vad.onnx
        buildPhase: resources
      - path: Resources/dictionary.sqlite
        buildPhase: resources
    dependencies:
      - package: CompanionPackage
        product: CompanionUI
      - package: CompanionPackage
        product: CompanionEngine
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Companion
        NSMicrophoneUsageDescription: Companion listens so you can talk with it. Everything it hears stays on this device.
        NSCameraUsageDescription: Companion watches for who is talking so it can turn to them. Nothing it sees is kept or leaves this device.
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
                                                UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snepssen.companion
        DEVELOPMENT_TEAM: BAZ45QTU23
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Companion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
