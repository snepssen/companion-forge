name: dependencies

# The speech engine comes from github.com/snepssen/voice-core, and the
# hearing layer and prompt cache from github.com/snepssen/speech-core. Once a
# day, or on demand from the Actions tab, this moves to the newest release of
# both, fetches the newest polyglot voice, runs cccheck, and pushes the new
# Package.resolved only if it passes. A run started by hand always runs the
# checks.
on:
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    uses: snepssen/site-core/.github/workflows/update-dependency.yml@main
    with:
      packages: voice-core speech-core
      package-path: .
      prepare: scripts/polyglot-voice.sh
      checks: swift run -q cccheck
      always-check: ${{ github.event_name == 'workflow_dispatch' }}
