name: voice-core

# The speech engine comes from github.com/snepssen/voice-core. Once a day, or
# on demand from the Actions tab, this moves to its newest release, fetches the
# newest polyglot voice, runs cccheck, and pushes the new Package.resolved only
# if it passes. A run started by hand always runs the checks.
on:
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    uses: snepssen/voice-core/.github/workflows/update-voice-core.yml@main
    with:
      package-path: .
      prepare: scripts/polyglot-voice.sh
      checks: swift run -q cccheck
      always-check: ${{ github.event_name == 'workflow_dispatch' }}
